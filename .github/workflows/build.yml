name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed to attach the exe to a release when a v* tag is pushed
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test InkSaver.sln -c Release --logger "console;verbosity=normal"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Publish single-file exe
        run: dotnet publish src/InkSaver/InkSaver.csproj -p:PublishProfile=win-x64 -p:Version="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: InkSaver-win-x64
          path: src/InkSaver/bin/publish/win-x64/InkSaver.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/InkSaver/bin/publish/win-x64/InkSaver.exe
